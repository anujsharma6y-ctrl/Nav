<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>माँ शेरावाली दिव्य नवरात्रि यात्रा</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Yatra+One&family=Tiro+Devanagari+Hindi:ital@0;1&family=Mukta:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --gold: #f7d070;
      --gold-bright: #ffe89e;
      --gold-dark: #b8860b;
      --deep-red: #5e0209;
      --maroon: #3b0005;
      --saffron: #e65c00;
      --glow-gold: 0 0 25px rgba(255, 215, 0, 0.7), 0 0 50px rgba(255, 140, 0, 0.4);
      --font-display: 'Rozha One', 'Yatra One', serif;
      --font-body: 'Tiro Devanagari Hindi', 'Mukta', serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 30%, #40030a 0%, #1a0104 60%, #080002 100%);
      color: #fff9e6;
      font-family: var(--font-body);
    }

    #bg-canvas, #fx-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    #bg-canvas { z-index: 1; }
    #fx-canvas { z-index: 20; }

    /* Divine Aura Light Background */
    .divine-aura {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 92vmin;
      height: 92vmin;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(255, 190, 40, 0.3) 0%, rgba(220, 60, 10, 0.16) 45%, rgba(0, 0, 0, 0) 70%);
      border-radius: 50%;
      filter: blur(40px);
      z-index: 2;
      animation: pulseAura 7s ease-in-out infinite alternate;
      pointer-events: none;
    }

    @keyframes pulseAura {
      0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.6; }
      100% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.95; }
    }

    /* Floating Audio Control */
    .audio-btn {
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 100;
      background: rgba(30, 0, 5, 0.8);
      border: 1.5px solid var(--gold);
      color: var(--gold);
      padding: 8px 18px;
      border-radius: 30px;
      font-family: var(--font-body);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6), var(--glow-gold);
      backdrop-filter: blur(8px);
      transition: all 0.3s ease;
    }
    .audio-btn:active { transform: scale(0.95); }

    /* Main Container */
    #experience-container {
      position: relative;
      width: 100%;
      height: 100%;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      text-align: center;
    }

    /* Deity Showcase Frame */
    .mata-darshan-frame {
      position: relative;
      width: min(84vmin, 440px);
      height: min(84vmin, 440px);
      max-height: 50vh;
      margin: 0 auto 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.8s ease;
    }

    .mata-darshan-frame img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 0 25px rgba(255, 200, 50, 0.75)) drop-shadow(0 0 50px rgba(230, 80, 0, 0.45));
      animation: divineHover 5s ease-in-out infinite alternate;
    }

    @keyframes divineHover {
      0% { transform: translateY(0px) scale(1); }
      100% { transform: translateY(-8px) scale(1.02); }
    }

    /* Typography */
    h1.devotional-title {
      font-family: var(--font-display);
      font-size: clamp(1.7rem, 4.4vw, 2.7rem);
      color: var(--gold-bright);
      text-shadow: 0 2px 10px rgba(0,0,0,0.9), 0 0 20px rgba(255, 215, 0, 0.6);
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

    p.instruction-text {
      font-size: clamp(1rem, 2.7vw, 1.35rem);
      color: #ffecc2;
      max-width: 650px;
      margin-bottom: 22px;
      line-height: 1.6;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    }

    /* Sacred Buttons */
    .btn-divine {
      background: linear-gradient(135deg, #d4380d 0%, #b31d04 50%, #780206 100%);
      color: #fff6d9;
      border: 2px solid var(--gold);
      padding: 13px 34px;
      font-size: clamp(1.05rem, 2.5vw, 1.3rem);
      font-family: var(--font-body);
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 25px rgba(0, 0, 0, 0.7), var(--glow-gold);
      transition: all 0.3s cubic-bezier(0.2, 0.8, 0.3, 1);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .btn-divine:hover {
      transform: translateY(-2px) scale(1.04);
      border-color: #ffffff;
      box-shadow: 0 8px 30px rgba(255, 180, 0, 0.85);
    }
    .btn-divine:active { transform: scale(0.96); }

    /* Interactive Elements */
    .touch-target {
      cursor: pointer;
      transition: transform 0.25s ease, filter 0.25s ease;
      touch-action: manipulation;
    }
    .touch-target:hover { transform: scale(1.1); filter: drop-shadow(0 0 15px gold); }
    .touch-target:active { transform: scale(0.95); }

    /* Questions / Quiz Grid */
    .options-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      max-width: 480px;
      width: 100%;
      margin: 10px auto 20px;
    }
    .quiz-card {
      background: rgba(40, 2, 7, 0.85);
      border: 1.5px solid rgba(247, 208, 112, 0.4);
      padding: 14px 18px;
      border-radius: 14px;
      color: #fff4d4;
      font-size: 1.15rem;
      cursor: pointer;
      transition: all 0.25s ease;
      backdrop-filter: blur(6px);
      font-family: var(--font-body);
      font-weight: 600;
    }
    .quiz-card:hover {
      border-color: var(--gold);
      background: rgba(70, 5, 12, 0.95);
      box-shadow: 0 0 15px rgba(255,215,0,0.4);
    }

    /* Ancient Temple Door Stage */
    .door-wrapper {
      position: relative;
      width: 260px;
      height: 310px;
      perspective: 1000px;
      margin: 10px auto 20px;
      display: flex;
    }
    .door-panel {
      width: 50%;
      height: 100%;
      background: linear-gradient(135deg, #7a2202, #380802);
      border: 3px solid var(--gold);
      box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 0 20px rgba(0,0,0,0.8);
      transition: transform 1.6s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-around;
      padding: 15px 5px;
    }
    .door-left { border-radius: 120px 0 0 8px; transform-origin: left; }
    .door-right { border-radius: 0 120px 8px 0; transform-origin: right; }
    .door-open .door-left { transform: rotateY(-110deg); }
    .door-open .door-right { transform: rotateY(110deg); }

    /* Aarti Plate */
    .aarti-plate-container {
      width: min(75vmin, 250px);
      height: min(75vmin, 250px);
      border-radius: 50%;
      background: radial-gradient(circle, #f5d77f 0%, #ba8b02 65%, #634300 100%);
      box-shadow: 0 0 35px rgba(255, 180, 0, 0.7), inset 0 0 25px rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      touch-action: none;
      border: 4px solid #fff2a8;
      position: relative;
      margin: 15px auto;
    }
    .aarti-plate-container:active { cursor: grabbing; }

    /* Blessing Screen Overlay */
    .blessing-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(20, 0, 4, 0.94) 0%, rgba(5, 0, 2, 0.98) 100%);
      z-index: 80;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .blessing-screen.active {
      opacity: 1;
      pointer-events: auto;
    }
    .blessing-card {
      max-width: 680px;
      background: linear-gradient(135deg, rgba(60, 2, 8, 0.88), rgba(30, 0, 4, 0.96));
      border: 2px solid var(--gold);
      border-radius: 24px;
      padding: clamp(24px, 5vw, 42px);
      box-shadow: 0 10px 40px rgba(0,0,0,0.9), 0 0 50px rgba(255, 200, 40, 0.35);
      position: relative;
    }
    .blessing-text {
      font-family: var(--font-display);
      font-size: clamp(1.3rem, 3.2vw, 2rem);
      line-height: 1.6;
      color: #fff2b8;
      text-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
      margin-bottom: 26px;
    }

    /* Grand Antique-Gold Greeting on Stage 20 */
    .final-tribute-banner {
      width: 100%;
      max-width: 720px;
      margin: 16px auto;
      padding: 16px 24px;
      background: radial-gradient(circle at center, rgba(120, 40, 10, 0.5) 0%, rgba(35, 5, 8, 0.85) 100%);
      border: 2px solid var(--gold);
      border-radius: 24px;
      box-shadow: 0 0 35px rgba(255, 200, 40, 0.5), inset 0 0 25px rgba(255, 230, 140, 0.2);
      animation: goldenGather 1.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      position: relative;
      overflow: hidden;
    }

    .final-tribute-text {
      font-family: var(--font-display);
      font-size: clamp(1.4rem, 3.8vw, 2.5rem);
      background: linear-gradient(135deg, #fffbeb 0%, #fef08a 25%, #f59e0b 55%, #d97706 80%, #78350f 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 10px rgba(245, 158, 11, 0.85));
      letter-spacing: 0.5px;
      line-height: 1.35;
    }

    @keyframes goldenGather {
      0% {
        opacity: 0;
        transform: scale(0.85) translateY(24px);
        filter: blur(10px) brightness(2);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
        filter: blur(0px) brightness(1);
      }
    }

    .fade-in { animation: fadeIn 0.8s ease-in-out forwards; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>

  <!-- Devotional Background Audio (Plays during initial walkthrough stages 1 to 16) -->
  <audio id="walkthrough-audio" loop preload="auto">
    <source src="O_Aaye_Tere_Bhawan_Music_by_Sonu_nigam_remix_by_Dj_Virat_Hajip.m4a" type="audio/mp4">
  </audio>

  <!-- Devotional Aarti Audio (Begins from Stage 17 Aarti onwards) -->
  <audio id="aarti-audio" loop preload="auto">
    <source src="xyz.mp3" type="audio/mpeg">
    <source src="xyz.m4a" type="audio/mp4">
  </audio>

  <button id="audio-toggle" class="audio-btn" aria-label="ध्वनि नियंत्रण">🔊 ध्वनि चालू / बंद</button>

  <canvas id="bg-canvas"></canvas>
  <div class="divine-aura"></div>
  <canvas id="fx-canvas"></canvas>

  <main id="experience-container" role="main"></main>

  <!-- Divine Blessing Screen Overlay -->
  <aside id="blessing-modal" class="blessing-screen" aria-live="polite">
    <div class="blessing-card fade-in">
      <div style="font-size: 2.6rem; margin-bottom: 12px;">🙏</div>
      <p id="blessing-content" class="blessing-text"></p>
      <button id="blessing-next-btn" class="btn-divine">आगे बढ़ें ➔</button>
    </div>
  </aside>

  <script>
    /* =========================================================================
       1. SYNTHESIZER & MULTI-TRACK AUDIO MANAGER
       ========================================================================= */
    class DevotionalSoundEngine {
      constructor() {
        this.ctx = null;
        this.isMuted = false;
        this.droneGain = null;
        this.initialized = false;
        this.currentMode = 'walkthrough'; // 'walkthrough' or 'aarti'
      }

      init() {
        if (this.initialized) return;
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioCtx();
        this.startDrone();
        this.initialized = true;
      }

      startWalkthroughTrack() {
        const wtAudio = document.getElementById('walkthrough-audio');
        if (wtAudio && !this.isMuted) {
          wtAudio.volume = 0.65;
          wtAudio.play().catch(() => {});
        }
      }

      switchToAartiTrack() {
        this.currentMode = 'aarti';
        const wtAudio = document.getElementById('walkthrough-audio');
        const aartiAudio = document.getElementById('aarti-audio');

        // Smooth fade out walkthrough track
        if (wtAudio) {
          let vol = wtAudio.volume;
          const fadeInterval = setInterval(() => {
            if (vol > 0.1) {
              vol -= 0.1;
              wtAudio.volume = Math.max(0, vol);
            } else {
              clearInterval(fadeInterval);
              wtAudio.pause();
              wtAudio.currentTime = 0;
            }
          }, 80);
        }

        // Start dedicated aarti song 'xyz'
        if (aartiAudio && !this.isMuted) {
          aartiAudio.volume = 0.75;
          aartiAudio.play().catch(() => {});
        }
      }

      toggleMute() {
        if (!this.initialized) { this.init(); }
        this.isMuted = !this.isMuted;
        const wtAudio = document.getElementById('walkthrough-audio');
        const aartiAudio = document.getElementById('aarti-audio');

        if (this.ctx) {
          if (this.isMuted) {
            this.ctx.suspend();
            if (wtAudio) wtAudio.pause();
            if (aartiAudio) aartiAudio.pause();
          } else {
            this.ctx.resume();
            if (this.currentMode === 'walkthrough' && wtAudio) {
              wtAudio.play().catch(() => {});
            } else if (this.currentMode === 'aarti' && aartiAudio) {
              aartiAudio.play().catch(() => {});
            }
          }
        }
        return !this.isMuted;
      }

      startDrone() {
        if (!this.ctx) return;
        this.droneGain = this.ctx.createGain();
        this.droneGain.gain.setValueAtTime(0.05, this.ctx.currentTime);
        this.droneGain.connect(this.ctx.destination);

        const osc1 = this.ctx.createOscillator();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(138.59, this.ctx.currentTime);

        const osc2 = this.ctx.createOscillator();
        osc2.type = 'triangle';
        osc2.frequency.setValueAtTime(207.65, this.ctx.currentTime);

        osc1.connect(this.droneGain);
        osc2.connect(this.droneGain);
        osc1.start();
        osc2.start();
      }

      playTempleBell(freq = 880) {
        if (!this.ctx || this.isMuted) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(0.38, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 2.8);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 2.9);

        const overtone = this.ctx.createOscillator();
        const overGain = this.ctx.createGain();
        overtone.type = 'triangle';
        overtone.frequency.setValueAtTime(freq * 2.76, now);
        overGain.gain.setValueAtTime(0.16, now);
        overGain.gain.exponentialRampToValueAtTime(0.0001, now + 1.6);
        overtone.connect(overGain);
        overGain.connect(this.ctx.destination);
        overtone.start(now);
        overtone.stop(now + 1.7);
      }

      playShankh() {
        if (!this.ctx || this.isMuted) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.exponentialRampToValueAtTime(260, now + 1.2);
        osc.frequency.exponentialRampToValueAtTime(210, now + 3.2);

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(450, now);

        gain.gain.setValueAtTime(0.01, now);
        gain.gain.linearRampToValueAtTime(0.45, now + 0.9);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 3.8);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 3.9);
      }

      playManjira() {
        if (!this.ctx || this.isMuted) return;
        this.playTempleBell(1760);
      }
    }

    const sound = new DevotionalSoundEngine();
    const audioBtn = document.getElementById('audio-toggle');
    audioBtn.addEventListener('click', () => {
      const active = sound.toggleMute();
      audioBtn.textContent = active ? '🔊 ध्वनि चालू' : '🔇 ध्वनि बंद';
    });

    /* =========================================================================
       2. CANVAS PARTICLES & SHOWER (Petals, Sparks & Fireworks)
       ========================================================================= */
    const bgCanvas = document.getElementById('bg-canvas');
    const bgCtx = bgCanvas.getContext('2d');
    const fxCanvas = document.getElementById('fx-canvas');
    const fxCtx = fxCanvas.getContext('2d');

    let w = bgCanvas.width = fxCanvas.width = window.innerWidth;
    let h = bgCanvas.height = fxCanvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      w = bgCanvas.width = fxCanvas.width = window.innerWidth;
      h = bgCanvas.height = fxCanvas.height = window.innerHeight;
    });

    const petals = [];
    const sparks = [];
    const fireworks = [];

    class SacredPetal {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * w;
        this.y = -20 - Math.random() * 50;
        this.size = 10 + Math.random() * 12;
        this.speedY = 1.2 + Math.random() * 2;
        this.speedX = Math.sin(Math.random() * Math.PI) * 1.5;
        this.rotation = Math.random() * 360;
        this.spin = (Math.random() - 0.5) * 2;
        this.color = ['#ff8800', '#ffaa00', '#d82200', '#f44336'][Math.floor(Math.random() * 4)];
      }
      update() {
        this.y += this.speedY;
        this.x += Math.sin(this.y * 0.015) + this.speedX * 0.4;
        this.rotation += this.spin;
        if (this.y > h + 20) this.reset();
      }
      draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate((this.rotation * Math.PI) / 180);
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.ellipse(0, 0, this.size * 0.5, this.size, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    class GoldenSpark {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * w;
        this.y = Math.random() * h;
        this.radius = 0.8 + Math.random() * 2.2;
        this.alpha = 0.2 + Math.random() * 0.8;
        this.speedY = -0.3 - Math.random() * 0.8;
      }
      update() {
        this.y += this.speedY;
        this.alpha += Math.sin(this.y * 0.05) * 0.02;
        if (this.y < -10) this.reset();
      }
      draw(ctx) {
        ctx.save();
        ctx.fillStyle = `rgba(255, 215, 100, ${Math.max(0.1, Math.min(1, this.alpha))})`;
        ctx.shadowBlur = 10;
        ctx.shadowColor = 'gold';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    for (let i = 0; i < 28; i++) petals.push(new SacredPetal());
    for (let i = 0; i < 65; i++) sparks.push(new GoldenSpark());

    function triggerFlowerShower(multiplier = 35) {
      for (let i = 0; i < multiplier; i++) {
        const p = new SacredPetal();
        p.y = -10;
        petals.push(p);
      }
      if (petals.length > 90) petals.splice(0, petals.length - 90);
    }

    function createFirework(x, y) {
      const colors = ['#ffe066', '#ff4d4d', '#ff9900', '#ffd700'];
      for (let i = 0; i < 35; i++) {
        const angle = Math.random() * Math.PI * 2;
        const vel = 2 + Math.random() * 4.5;
        fireworks.push({
          x, y,
          vx: Math.cos(angle) * vel,
          vy: Math.sin(angle) * vel,
          alpha: 1,
          color: colors[Math.floor(Math.random() * colors.length)]
        });
      }
    }

    function renderParticles() {
      bgCtx.clearRect(0, 0, w, h);
      fxCtx.clearRect(0, 0, w, h);

      for (let s of sparks) {
        s.update();
        s.draw(bgCtx);
      }
      for (let p of petals) {
        p.update();
        p.draw(fxCtx);
      }

      for (let i = fireworks.length - 1; i >= 0; i--) {
        const f = fireworks[i];
        f.x += f.vx;
        f.y += f.vy;
        f.vy += 0.05;
        f.alpha -= 0.02;
        if (f.alpha <= 0) {
          fireworks.splice(i, 1);
          continue;
        }
        fxCtx.save();
        fxCtx.fillStyle = f.color;
        fxCtx.globalAlpha = f.alpha;
        fxCtx.shadowBlur = 12;
        fxCtx.shadowColor = 'gold';
        fxCtx.beginPath();
        fxCtx.arc(f.x, f.y, 2.5, 0, Math.PI * 2);
        fxCtx.fill();
        fxCtx.restore();
      }

      requestAnimationFrame(renderParticles);
    }
    renderParticles();

    /* =========================================================================
       3. EXACT FILENAMES MAPPING

    const IMG_SANCTUM_NIGHT   = "Screenshot_20260929-212039.png";

            <p class="instruction-text fade-in">मंगलमय शंख ध्वनि के साथ दिव्य वातावरण का स्वागत करें।</p>
            <div id="shankh-el" class="touch-target fade-in" style="font-size: 6.5rem; margin: 25px 0;">🐚</div>
            <p style="color: var(--gold);">(शंख को स्पर्श करें)</p>
          `;
          document.getElementById('shankh-el').onclick = () => {
            sound.playShankh();
            triggerFlowerShower(40);
            setTimeout(() => {
              showBlessing("माता रानी के आशीर्वाद से आपके जीवन में हर दिन मंगल, शांति और सकारात्मकता बनी रहे।", () => renderStage(16));
            }, 1200);
          };
          break;

        /* ---------------- STAGE 16: दिव्य दर्शन ---------------- */
        case 16:
          container.innerHTML = `
            <div class="mata-darshan-frame fade-in">
              <img src="${IMG_SHERAWALI_LION}" alt="माँ शेरावाली दर्शन" />
            </div>
            <h1 class="devotional-title fade-in">माँ का आलोक</h1>
            <p class="instruction-text fade-in">माँ का यह दिव्य प्रकाश आपके जीवन से हर चिंता और अंधकार को दूर करे।</p>
            <button id="darshan-btn" class="btn-divine fade-in">दर्शन करें 🙏</button>
          `;
          document.getElementById('darshan-btn').onclick = () => {
            sound.playTempleBell(880);
            showBlessing("माँ का यह दिव्य प्रकाश आपके जीवन से हर चिंता और अंधकार को दूर करे।", () => renderStage(17));
          };
          break;

        /* ---------------- STAGE 17: महा आरती (Transitions to 'xyz' track) ---------------- */
        case 17:
          sound.switchToAartiTrack();
          container.innerHTML = `
            <div class="mata-darshan-frame fade-in">
              <img src="${IMG_SHERAWALI_LION}" alt="माँ शेरावाली आरती" />
            </div>
            <h1 class="devotional-title fade-in">महा आरती</h1>
            <p class="instruction-text fade-in">आरती की थाल को स्पर्श कर माता रानी की आरती संपन्न करें।</p>
            <div id="aarti-plate" class="aarti-plate-container touch-target fade-in">
              <div style="font-size: 3.5rem;">🪔</div>
              <div style="position: absolute; bottom: 15px; font-size: 1.8rem;">🌺</div>
            </div>
            <button id="finish-aarti-btn" class="btn-divine">आरती पूर्ण करें 🔔</button>
          `;
          const completeAarti = () => {
            sound.playTempleBell(1046);
            sound.playShankh();
            triggerFlowerShower(50);
            showBlessing("माता रानी आपके और आपके परिवार पर अपनी कृपा और आशीर्वाद सदैव बनाए रखें।", () => renderStage(18));
          };
          document.getElementById('aarti-plate').onclick = () => {
            sound.playManjira();
            document.getElementById('aarti-plate').style.transform = 'rotate(20deg)';
            setTimeout(() => document.getElementById('aarti-plate').style.transform = 'none', 300);
          };
          document.getElementById('finish-aarti-btn').onclick = completeAarti;
          break;

        /* ---------------- STAGE 18: भव्य नवरात्रि उत्सव ---------------- */
        case 18:
          container.innerHTML = `
            <div class="mata-darshan-frame fade-in">
              <img src="${IMG_TEMPLE_JEWELED}" alt="भव्य नवरात्रि उत्सव" />
            </div>
            <h1 class="devotional-title fade-in">🌺 शुभ नवरात्रि 🌺</h1>
            <p class="instruction-text fade-in" style="font-size: 1.5rem; color: #ffebaa; font-weight: 700;">जय माता दी 🙏</p>
            <button id="fest-btn" class="btn-divine fade-in">आशीर्वाद ग्रहण करें 🙏</button>
          `;
          createFirework(w * 0.3, h * 0.4);
          createFirework(w * 0.7, h * 0.4);
          sound.playTempleBell(880);
          document.getElementById('fest-btn').onclick = () => {
            sound.playTempleBell(1046);
            showBlessing("माँ दुर्गा आपके जीवन में सुख, शांति, शक्ति, समृद्धि और सफलता का आशीर्वाद प्रदान करें।", () => renderStage(19));
          };
          break;

        /* ---------------- STAGE 19: विशेष मनोकामना ---------------- */
        case 19:
          container.innerHTML = `
            <div class="mata-darshan-frame fade-in">
              <img src="${IMG_SHERAWALI_LION}" alt="माँ शेरावाली" />
            </div>
            <h1 class="devotional-title fade-in">मनोकामना समर्पण</h1>
            <p class="instruction-text fade-in">माता रानी के चरणों में आपकी हर शुभ मनोकामना समर्पित है। माँ आपकी सभी शुभ इच्छाएँ पूर्ण करें।</p>
            <button id="darshan-final-btn" class="btn-divine fade-in">अंतिम दिव्य दर्शन 🪷</button>
          `;
          document.getElementById('darshan-final-btn').onclick = () => {
            sound.playShankh();
            renderStage(20);
          };
          break;

        /* ---------------- STAGE 20: अंतिम परम दिव्य दर्शन ---------------- */
        case 20:
          container.innerHTML = `
            <div class="mata-darshan-frame fade-in" style="width: min(88vmin, 480px); max-height: 48vh;">
              <img src="${IMG_SHERAWALI_LION}" alt="शेरावाली माता अंतिम दर्शन" />
            </div>
            <h1 class="devotional-title fade-in" style="font-size: clamp(2rem, 5vw, 3.2rem); margin-bottom: 4px;">🌺 जय माता दी 🌺</h1>
            
            <!-- Large Elegant Antique-Gold Greeting prominently for Anuj Sharma -->
            <div class="final-tribute-banner">
              <div class="final-tribute-text">
                🌺 अनुज शर्मा की ओर से हार्दिक शुभकामनाएँ 🌺
              </div>
            </div>

            <p class="instruction-text fade-in" style="margin-bottom: 8px;">माता रानी की कृपा आप और आपके परिवार पर सदैव बनी रहे। आपके जीवन में सुख, शांति, समृद्धि और खुशियों का वास हो।</p>
            <h2 class="fade-in" style="font-family: var(--font-display); color: #ffd700; margin-bottom: 18px; font-size: 1.8rem;">🙏 शुभ नवरात्रि 🙏</h2>
            
            <button id="restart-btn" class="btn-divine fade-in">दिव्य यात्रा पुनः प्रारंभ करें 🔄</button>
          `;
          sound.playTempleBell(1046);
          triggerFlowerShower(65);
          createFirework(w * 0.5, h * 0.35);

          document.getElementById('restart-btn').onclick = () => {
            // Reset to beginning and restore walkthrough music
            sound.currentMode = 'walkthrough';
            const aartiAudio = document.getElementById('aarti-audio');
            if (aartiAudio) {
              aartiAudio.pause();
              aartiAudio.currentTime = 0;
            }
            renderStage(1);
          };
          break;
      }
    }

    renderStage(1);
  </script>
</body>
</html>
