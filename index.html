<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>माँ शेरावाली दिव्य नवरात्रि यात्रा</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Yatra+One&family=Tiro+Devanagari+Hindi:ital@0;1&family=Mukta:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --gold: #f7d070;
      --gold-bright: #ffe89e;
      --gold-dark: #b8860b;
      --deep-red: #5e0209;
      --maroon: #3b0005;
      --saffron: #e65c00;
      --glow-gold: 0 0 25px rgba(255, 215, 0, 0.7), 0 0 50px rgba(255, 140, 0, 0.4);
      --font-display: 'Rozha One', 'Yatra One', serif;
      --font-body: 'Tiro Devanagari Hindi', 'Mukta', serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 30%, #40030a 0%, #1a0104 60%, #080002 100%);
      color: #fff9e6;
      font-family: var(--font-body);
    }

    #bg-canvas, #fx-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    #bg-canvas { z-index: 1; }
    #fx-canvas { z-index: 20; }

    .divine-aura {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 92vmin;
      height: 92vmin;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(255, 190, 40, 0.3) 0%, rgba(220, 60, 10, 0.16) 45%, rgba(0, 0, 0, 0) 70%);
      border-radius: 50%;
      filter: blur(40px);
      z-index: 2;
      animation: pulseAura 7s ease-in-out infinite alternate;
      pointer-events: none;
    }

    @keyframes pulseAura {
      0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.6; }
      100% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.95; }
    }

    /* केवल संगीत का ऑन/ऑफ बटन */
    .music-btn {
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 100;
      background: rgba(35, 2, 6, 0.82);
      border: 1.5px solid var(--gold);
      color: var(--gold);
      padding: 8px 18px;
      border-radius: 30px;
      font-family: var(--font-body);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6), var(--glow-gold);
      backdrop-filter: blur(8px);
      transition: all 0.3s ease;
    }
    .music-btn:active { transform: scale(0.95); }

    #experience-container {
      position: relative;
      width: 100%;
      height: 100%;
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      text-align: center;
    }

    .mata-darshan-frame {
      position: relative;
      width: min(84vmin, 440px);
      height: min(84vmin, 440px);
      max-height: 48vh;
      margin: 0 auto 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.8s ease;
    }

    .mata-darshan-frame img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 0 25px rgba(255, 200, 50, 0.75)) drop-shadow(0 0 50px rgba(230, 80, 0, 0.45));
      animation: divineHover 5s ease-in-out infinite alternate;
    }

    @keyframes divineHover {
      0% { transform: translateY(0px) scale(1); }
      100% { transform: translateY(-8px) scale(1.02); }
    }

    h1.devotional-title {
      font-family: var(--font-display);
      font-size: clamp(1.7rem, 4.4vw, 2.7rem);
      color: var(--gold-bright);
      text-shadow: 0 2px 10px rgba(0,0,0,0.9), 0 0 20px rgba(255, 215, 0, 0.6);
      margin-bottom: 8px;
      letter-spacing: 1px;
    }

    p.instruction-text {
      font-size: clamp(1rem, 2.7vw, 1.35rem);
      color: #ffecc2;
      max-width: 650px;
      margin-bottom: 20px;
      line-height: 1.6;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    }

    .anuj-badge {
      display: inline-block;
      font-size: 0.95rem;
      color: #ffdda1;
      border: 1px solid rgba(247, 208, 112, 0.4);
      background: rgba(45, 4, 8, 0.65);
      padding: 4px 16px;
      border-radius: 20px;
      margin-bottom: 12px;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
    }

    .btn-divine {
      background: linear-gradient(135deg, #d4380d 0%, #b31d04 50%, #780206 100%);
      color: #fff6d9;
      border: 2px solid var(--gold);
      padding: 13px 34px;
      font-size: clamp(1.05rem, 2.5vw, 1.3rem);
      font-family: var(--font-body);
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 25px rgba(0, 0, 0, 0.7), var(--glow-gold);
      transition: all 0.3s cubic-bezier(0.2, 0.8, 0.3, 1);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .btn-divine:hover {
      transform: translateY(-2px) scale(1.04);
      border-color: #ffffff;
      box-shadow: 0 8px 30px rgba(255, 180, 0, 0.85);
    }
    .btn-divine:active { transform: scale(0.96); }

    .touch-target {
      cursor: pointer;
      transition: transform 0.25s ease, filter 0.25s ease;
      touch-action: manipulation;
    }
    .touch-target:hover { transform: scale(1.1); filter: drop-shadow(0 0 15px gold); }
    .touch-target:active { transform: scale(0.95); }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      max-width: 480px;
      width: 100%;
      margin: 10px auto 20px;
    }
    .quiz-card {
      background: rgba(40, 2, 7, 0.85);
      border: 1.5px solid rgba(247, 208, 112, 0.4);
      padding: 14px 18px;
      border-radius: 14px;
      color: #fff4d4;
      font-size: 1.15rem;
      cursor: pointer;
      transition: all 0.25s ease;
      backdrop-filter: blur(6px);
      font-family: var(--font-body);
      font-weight: 600;
    }
    .quiz-card:hover {
      border-color: var(--gold);
      background: rgba(70, 5, 12, 0.95);
      box-shadow: 0 0 15px rgba(255,215,0,0.4);
    }

    /* मंदिर के कपाट */
    .door-wrapper {
      position: relative;
      width: 280px;
      height: 330px;
      perspective: 1000px;
      margin: 10px auto 20px;
      border-radius: 140px 140px 10px 10px;
      overflow: hidden;
      border: 3px solid var(--gold);
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.5);
    }
    .door-panel {
      position: absolute;
      top: 0;
      width: 50%;
      height: 100%;
      background: linear-gradient(135deg, #7a2202, #380802);
      border: 2px solid var(--gold);
      box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
      transition: transform 1.8s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-around;
      z-index: 5;
    }
    .door-left { left: 0; transform-origin: left; border-radius: 140px 0 0 0; }
    .door-right { right: 0; transform-origin: right; border-radius: 0 140px 0 0; }
    .door-open .door-left { transform: rotateY(-115deg); }
    .door-open .door-right { transform: rotateY(115deg); }

    /* आरती दीपक परिक्रमा कंटेनर */
    .aarti-stage-wrapper {
      position: relative;
      width: min(85vmin, 380px);
      height: min(85vmin, 380px);
      margin: 10px auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .aarti-orbit-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 1.5px dashed rgba(247, 208, 112, 0.35);
      pointer-events: none;
    }
    .revolving-diya {
      position: absolute;
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.8rem;
      filter: drop-shadow(0 0 20px gold);
      pointer-events: none;
    }
    @keyframes circumambulate {
      0% { transform: rotate(0deg) translateX(min(38vmin, 160px)) rotate(0deg); }
      100% { transform: rotate(1080deg) translateX(min(38vmin, 160px)) rotate(-1080deg); }
    }
    .animate-aarti-revolution {
      animation: circumambulate 7.5s ease-in-out forwards;
    }

    .blessing-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(20, 0, 4, 0.94) 0%, rgba(5, 0, 2, 0.98) 100%);
      z-index: 80;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .blessing-screen.active {
      opacity: 1;
      pointer-events: auto;
    }
    .blessing-card {
      max-width: 680px;
      background: linear-gradient(135deg, rgba(60, 2, 8, 0.88), rgba(30, 0, 4, 0.96));
      border: 2px solid var(--gold);
      border-radius: 24px;
      padding: clamp(24px, 5vw, 42px);
      box-shadow: 0 10px 40px rgba(0,0,0,0.9), 0 0 50px rgba(255, 200, 40, 0.35);
      position: relative;
    }
    .blessing-text {
      font-family: var(--font-display);
      font-size: clamp(1.3rem, 3.2vw, 2rem);
      line-height: 1.6;
      color: #fff2b8;
      text-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
      margin-bottom: 26px;
    }

    /* अंतिम स्क्रीन का विशेष अनुज शर्मा शुभकामना बैनर */
    .final-tribute-banner {
      width: 100%;
      max-width: min(900px, 94vw);
      margin: 12px auto;
      padding: 14px 20px;
      background: linear-gradient(180deg, #4a0710 0%, #200207 100%);
      border: 3px solid #ffd700;
      border-radius: 20px;
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.6), inset 0 0 15px rgba(255, 215, 0, 0.25);
      position: relative;
      z-index: 25;
      text-align: center;
      animation: goldenGather 1.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      flex-shrink: 0;
    }

    .final-tribute-text {
      font-family: var(--font-display);
      font-size: clamp(1.35rem, 3.2vw, 2.1rem);
      font-weight: 800;
      color: #fff8dc;
      text-shadow: 
        0 2px 5px #000,
        0 0 12px rgba(255, 215, 0, 0.7);
      line-height: 1.4;
      letter-spacing: 0.5px;
      display: block;
    }

    @keyframes goldenGather {
      0% {
        opacity: 0;
        transform: scale(0.9) translateY(20px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .fade-in { animation: fadeIn 0.8s ease-in-out forwards; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>

  <!-- पृष्ठभूमि संगीत (प्रारंभिक यात्रा हेतु) -->
  <audio id="walkthrough-audio" loop preload="auto">
    <source src="O_Aaye_Tere_Bhawan_Music_by_Sonu_nigam_remix_by_Dj_Virat_Hajip.m4a" type="audio/mp4">
  </audio>

  <!-- महा आरती संगीत (चरण 17 से प्रारंभ) -->
  <audio id="aarti-audio" loop preload="auto">
    <source src="xyz.mp3" type="audio/mpeg">
    <source src="xyz.m4a" type="audio/mp4">
  </audio>

  <!-- संगीत चालू/बंद बटन -->
  <button id="music-toggle" class="music-btn" aria-label="संगीत नियंत्रण">🎵 संगीत: चालू</button>

  <canvas id="bg-canvas"></canvas>
  <div class="divine-aura"></div>
  <canvas id="fx-canvas"></canvas>

  <main id="experience-container" role="main"></main>

  <aside id="blessing-modal" class="blessing-screen" aria-live="polite">
    <div class="blessing-card fade-in">
      <div style="font-size: 2.6rem; margin-bottom: 12px;">🙏</div>
      <p id="blessing-content" class="blessing-text"></p>
      <button id="blessing-next-btn" class="btn-divine">आगे बढ़ें ➔</button>
    </div>
  </aside>

  <script>
    /* =========================================================================
       1. ध्वनियाँ एवं संगीत प्रबंधन
       ========================================================================= */
    class DevotionalSoundEngine {
      constructor() {
        this.ctx = null;
        this.musicMuted = false;
        this.currentMode = 'walkthrough';
        this.initialized = false;
      }

      init() {
        if (this.initialized) return;
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioCtx();
        this.initialized = true;
      }

      startWalkthroughTrack() {
        const wtAudio = document.getElementById('walkthrough-audio');
        if (wtAudio && !this.musicMuted) {
          wtAudio.volume = 0.65;
          wtAudio.play().catch(() => {});
        }
      }

      switchToAartiTrack() {
        this.currentMode = 'aarti';
        const wtAudio = document.getElementById('walkthrough-audio');
        const aartiAudio = document.getElementById('aarti-audio');

        if (wtAudio) {
          wtAudio.pause();
          wtAudio.currentTime = 0;
        }

        if (aartiAudio && !this.musicMuted) {
          aartiAudio.volume = 0.75;
          aartiAudio.play().catch(() => {});
        }
      }

      toggleMusic() {
        this.musicMuted = !this.musicMuted;
        const wtAudio = document.getElementById('walkthrough-audio');
        const aartiAudio = document.getElementById('aarti-audio');

        if (this.musicMuted) {
          if (wtAudio) wtAudio.pause();
          if (aartiAudio) aartiAudio.pause();
        } else {
          if (this.currentMode === 'walkthrough' && wtAudio) {
            wtAudio.play().catch(() => {});
          } else if (this.currentMode === 'aarti' && aartiAudio) {
            aartiAudio.play().catch(() => {});
          }
        }
        return !this.musicMuted;
      }

      playTempleBell(freq = 880) {
        this.init();
        if (!this.ctx) return;
        if (this.ctx.state === 'suspended') this.ctx.resume();

        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 2.8);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 2.9);

        const overtone = this.ctx.createOscillator();
        const overGain = this.ctx.createGain();
        overtone.type = 'triangle';
        overtone.frequency.setValueAtTime(freq * 2.76, now);
        overGain.gain.setValueAtTime(0.18, now);
        overGain.gain.exponentialRampToValueAtTime(0.0001, now + 1.6);
        overtone.connect(overGain);
        overGain.connect(this.ctx.destination);
        overtone.start(now);
        overtone.stop(now + 1.7);
      }

      playShankh() {
        this.init();
        if (!this.ctx) return;
        if (this.ctx.state === 'suspended') this.ctx.resume();

        // Layered, conch-like shankh tone. Starts on a tap so mobile browsers allow audio.
        const now = this.ctx.currentTime;
        const master = this.ctx.createGain();
        master.gain.setValueAtTime(0.0001, now);
        master.gain.linearRampToValueAtTime(0.32, now + 0.7);
        master.gain.setValueAtTime(0.28, now + 2.4);
        master.gain.exponentialRampToValueAtTime(0.0001, now + 4.6);

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(700, now);
        filter.frequency.linearRampToValueAtTime(1100, now + 1.0);
        filter.frequency.linearRampToValueAtTime(650, now + 4.3);
        filter.Q.value = 1.2;
        filter.connect(master);
        master.connect(this.ctx.destination);

        // Fundamental plus soft harmonics create a fuller devotional conch effect.
        [1, 2.01, 3.02].forEach((harmonic, index) => {
          const osc = this.ctx.createOscillator();
          const level = this.ctx.createGain();
          osc.type = index === 0 ? 'triangle' : 'sine';
          osc.frequency.setValueAtTime(145 * harmonic, now);
          osc.frequency.exponentialRampToValueAtTime(195 * harmonic, now + 1.15);
          osc.frequency.exponentialRampToValueAtTime(155 * harmonic, now + 3.8);
          level.gain.value = [1, 0.34, 0.12][index];
          osc.connect(level);
          level.connect(filter);
          osc.start(now);
          osc.stop(now + 4.7);
        });
      }

      playManjira() {
        this.playTempleBell(1760);
      }
    }

    const sound = new DevotionalSoundEngine();
    const musicBtn = document.getElementById('music-toggle');
    musicBtn.addEventListener('click', () => {
      const isPlaying = sound.toggleMusic();
      musicBtn.textContent = isPlaying ? '🎵 संगीत: चालू' : '🔇 संगीत: बंद';
    });

    /* =========================================================================
       2. पुष्प वर्षा एवं स्वर्णिम प्रभाव
       ========================================================================= */
    const bgCanvas = document.getElementById('bg-canvas');
    const bgCtx = bgCanvas.getContext('2d');
    const fxCanvas = document.getElementById('fx-canvas');
    const fxCtx = fxCanvas.getContext('2d');

    let w = bgCanvas.width = fxCanvas.width = window.innerWidth;
    let h = bgCanvas.height = fxCanvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      w = bgCanvas.width = fxCanvas.width = window.innerWidth;
      h = bgCanvas.height = fxCanvas.height = window.innerHeight;
    });

    const petals = [];
    const sparks = [];
    const fireworks = [];

    class SacredPetal {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * w;
        this.y = -20 - Math.random() * 50;
        this.size = 10 + Math.random() * 12;
        this.speedY = 1.2 + Math.random() * 2;
        this.speedX = Math.sin(Math.random() * Math.PI) * 1.5;
        this.rotation = Math.random() * 360;
        this.spin = (Math.random() - 0.5) * 2;
        this.color = ['#ff8800', '#ffaa00', '#d82200', '#f44336'][Math.floor(Math.random() * 4)];
      }
      update() {
        this.y += this.speedY;
        this.x += Math.sin(this.y * 0.015) + this.speedX * 0.4;
        this.rotation += this.spin;
        if (this.y > h + 20) this.reset();
      }
      draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate((this.rotation * Math.PI) / 180);
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.ellipse(0, 0, this.size * 0.5, this.size, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    class GoldenSpark {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * w;
        this.y = Math.random() * h;
        this.radius = 0.8 + Math.random() * 2.2;
        this.alpha = 0.2 + Math.random() * 0.8;
        this.speedY = -0.3 - Math.random() * 0.8;
      }
      update() {
        this.y += this.speedY;
        this.alpha += Math.sin(this.y * 0.05) * 0.02;
        if (this.y < -10) this.reset();
      }
      draw(ctx) {
        ctx.save();
        ctx.fillStyle = `rgba(255, 215, 100, ${Math.max(0.1, Math.min(1, this.alpha))})`;
        ctx.shadowBlur = 10;
        ctx.shadowColor = 'gold';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    for (let i = 0; i < 28; i++) petals.push(new SacredPetal());
    for (let i = 0; i < 65; i++) sparks.push(new GoldenSpark());

    function triggerFlowerShower(multiplier = 3
