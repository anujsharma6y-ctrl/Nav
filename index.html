<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>माँ शेरावाली दिव्य नवरात्रि यात्रा</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Yatra+One&family=Tiro+Devanagari+Hindi:ital@0;1&family=Mukta:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --gold: #f7d070;
      --gold-bright: #ffe89e;
      --gold-dark: #b8860b;
      --deep-red: #5e0209;
      --maroon: #3b0005;
      --saffron: #e65c00;
      --glow-gold: 0 0 25px rgba(255, 215, 0, 0.7), 0 0 50px rgba(255, 140, 0, 0.4);
      --font-display: 'Rozha One', 'Yatra One', serif;
      --font-body: 'Tiro Devanagari Hindi', 'Mukta', serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 30%, #40030a 0%, #1a0104 60%, #080002 100%);
      color: #fff9e6;
      font-family: var(--font-body);
    }

    #bg-canvas, #fx-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    #bg-canvas { z-index: 1; }
    #fx-canvas { z-index: 20; }

    /* Divine Aura Light Background */
    .divine-aura {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 92vmin;
      height: 92vmin;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(255, 190, 40, 0.3) 0%, rgba(220, 60, 10, 0.16) 45%, rgba(0, 0, 0, 0) 70%);
      border-radius: 50%;
      filter: blur(40px);
      z-index: 2;
      animation: pulseAura 7s ease-in-out infinite alternate;
      pointer-events: none;
    }

    @keyframes pulseAura {
      0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.6; }
      100% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.95; }
    }

    /* Floating Audio Control */
    .audio-btn {
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 100;
      background: rgba(30, 0, 5, 0.75);
      border: 1.5px solid var(--gold);
      color: var(--gold);
      padding: 8px 16px;
      border-radius: 30px;
      font-family: var(--font-body);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6), var(--glow-gold);
      backdrop-filter: blur(8px);
      transition: all 0.3s ease;
    }
    .audio-btn:active { transform: scale(0.95); }

    /* Main Container */
    #experience-container {
      position: relative;
      width: 100%;
      height: 100%;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      text-align: center;
    }

    /* Deity Showcase Frame */
    .mata-darshan-frame {
      position: relative;
      width: min(84vmin, 440px);
      height: min(84vmin, 440px);
      max-height: 50vh;
      margin: 0 auto 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.8s ease;
    }

    .mata-darshan-frame img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 0 25px rgba(255, 200, 50, 0.75)) drop-shadow(0 0 50px rgba(230, 80, 0, 0.45));
      animation: divineHover 5s ease-in-out infinite alternate;
    }

    @keyframes divineHover {
      0% { transform: translateY(0px) scale(1); }
      100% { transform: translateY(-8px) scale(1.02); }
    }

    /* Typography */
    h1.devotional-title {
      font-family: var(--font-display);
      font-size: clamp(1.7rem, 4.4vw, 2.7rem);
      color: var(--gold-bright);
      text-shadow: 0 2px 10px rgba(0,0,0,0.9), 0 0 20px rgba(255, 215, 0, 0.6);
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

    p.instruction-text {
      font-size: clamp(1rem, 2.7vw, 1.35rem);
      color: #ffecc2;
      max-width: 650px;
      margin-bottom: 22px;
      line-height: 1.6;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    }

    /* Sacred Buttons */
    .btn-divine {
      background: linear-gradient(135deg, #d4380d 0%, #b31d04 50%, #780206 100%);
      color: #fff6d9;
      border: 2px solid var(--gold);
      padding: 13px 32px;
      font-size: clamp(1.05rem, 2.5vw, 1.3rem);
      font-family: var(--font-body);
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 25px rgba(0, 0, 0, 0.7), var(--glow-gold);
      transition: all 0.3s cubic-bezier(0.2, 0.8, 0.3, 1);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .btn-divine:hover {
      transform: translateY(-2px) scale(1.04);
      border-color: #ffffff;
      box-shadow: 0 8px 30px rgba(255, 180, 0, 0.85);
    }
    .btn-divine:active { transform: scale(0.96); }

    /* Interactive Elements */
    .touch-target {
      cursor: pointer;
      transition: transform 0.25s ease, filter 0.25s ease;
      touch-action: manipulation;
    }
    .touch-target:hover { transform: scale(1.1); filter: drop-shadow(0 0 15px gold); }
    .touch-target:active { transform: scale(0.95); }

    /* Questions / Quiz Grid */
    .options-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      max-width: 480px;
      width: 100%;
      margin: 10px auto 20px;
    }
    .quiz-card {
      background: rgba(40, 2, 7, 0.85);
      border: 1.5px solid rgba(247, 208, 112, 0.4);
      padding: 14px 18px;
      border-radius: 14px;
      color: #fff4d4;
      font-size: 1.15rem;
      cursor: pointer;
      transition: all 0.25s ease;
      backdrop-filter: blur(6px);
      font-family: var(--font-body);
      font-weight: 600;
    }
    .quiz-card:hover {
      border-color: var(--gold);
      background: rgba(70, 5, 12, 0.95);
      box-shadow: 0 0 15px rgba(255,215,0,0.4);
    }

    /* Ancient Temple Door Stage */
    .door-wrapper {
      position: relative;
      width: 260px;
      height: 310px;
      perspective: 1000px;
      margin: 10px auto 20px;
      display: flex;
    }
    .door-panel {
      width: 50%;
      height: 100%;
      background: linear-gradient(135deg, #7a2202, #380802);
      border: 3px solid var(--gold);
      box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 0 20px rgba(0,0,0,0.8);
      transition: transform 1.6s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-around;
      padding: 15px 5px;
    }
    .door-left { border-radius: 120px 0 0 8px; transform-origin: left; }
    .door-right { border-radius: 0 120px 8px 0; transform-origin: right; }
    .door-open .door-left { transform: rotateY(-110deg); }
    .door-open .door-right { transform: rotateY(110deg); }

    /* Aarti Plate */
    .aarti-plate-container {
      width: min(75vmin, 250px);
      height: min(75vmin, 250px);
      border-radius: 50%;
      background: radial-gradient(circle, #f5d77f 0%, #ba8b02 65%, #634300 100%);
      box-shadow: 0 0 35px rgba(255, 180, 0, 0.7), inset 0 0 25px rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      touch-action: none;
      border: 4px solid #fff2a8;
      position: relative;
      margin: 15px auto;
    }
    .aarti-plate-container:active { cursor: grabbing; }

    /* Blessing Screen Overlay */
    .blessing-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(20, 0, 4, 0.94) 0%, rgba(5, 0, 2, 0.98) 100%);
      z-index: 80;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .blessing-screen.active {
      opacity: 1;
      pointer-events: auto;
    }
    .blessing-card {
      max-width: 680px;
      background: linear-gradient(135deg, rgba(60, 2, 8, 0.88), rgba(30, 0, 4, 0.96));
      border: 2px solid var(--gold);
      border-radius: 24px;
      padding: clamp(24px, 5vw, 42px);
      box-shadow: 0 10px 40px rgba(0,0,0,0.9), 0 0 50px rgba(255, 200, 40, 0.35);
      position: relative;
    }
    .blessing-text {
      font-family: var(--font-display);
      font-size: clamp(1.3rem, 3.2vw, 2rem);
      line-height: 1.6;
      color: #fff2b8;
      text-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
      margin-bottom: 26px;
    }

    /* Final Tribute Styling */
    .final-tribute {
      font-family: var(--font-display);
      font-size: clamp(1.35rem, 3.4vw, 2.35rem);
      color: #fff1b0;
      text-shadow: 0 0 15px rgba(255, 215, 0, 0.85), 0 0 35px rgba(255, 140, 0, 0.65);
      margin: 14px 0;
      padding: 10px 20px;
      border-top: 1.5px solid rgba(247, 208, 112, 0.5);
      border-bottom: 1.5px solid rgba(247, 208, 112, 0.5);
      animation: shimmerTribute 3s ease-in-out infinite alternate;
    }
    @keyframes shimmerTribute {
      0% { filter: drop-shadow(0 0 6px rgba(255, 215, 0, 0.6)); }
      100% { filter: drop-shadow(0 0 20px rgba(255, 180, 0, 0.95)); }
    }

    .fade-in { animation: fadeIn 0.8s ease-in-out forwards; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>

  <!-- Audio track provided by user -->
  <audio id="bg-audio" loop preload="auto">
    <source src="O_Aaye_Tere_Bhawan_Music_by_Sonu_nigam_remix_by_Dj_Virat_Hajip.m4a" type="audio/mp4">
  </audio>

  <button id="audio-toggle" class="audio-btn" aria-label="ध्वनि नियंत्रण">🔊 ध्वनि चालू / बंद</button>

  <canvas id="bg-canvas"></canvas>
  <div class="divine-aura"></div>
  <canvas id="fx-canvas"></canvas>

  <main id="experience-container" role="main"></main>

  <!-- Divine Blessing Screen Overlay -->
  <aside id="blessing-modal" class="blessing-screen" aria-live="polite">
    <div class="blessing-card fade-in">
      <div style="font-size: 2.6rem; margin-bottom: 12px;">🙏</div>
      <p id="blessing-content" class="blessing-text"></p>
      <button id="blessing-next-btn" class="btn-divine">आगे बढ़ें ➔</button>
    </div>
  </aside>

  <script>
    /* =========================================================================
       1. DEVOTIONAL SOUND SYNTHESIZER & AUDIO MANAGER
       ========================================================================= */
    class DevotionalSoundEngine {
      constructor() {
        this.ctx = null;
        this.isMuted = false;
        this.droneGain = null;
        this.initialized = false;
      }

      init() {
        if (this.initialized) return;
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioCtx();
        this.startDrone();
        this.initialized = true;
      }

      toggleMute() {
        if (!this.initialized) { this.init(); }
        this.isMuted = !this.isMuted;
        const bgAudio = document.getElementById('bg-audio');

        if (this.ctx) {
          if (this.isMuted) {
            this.ctx.suspend();
            if (bgAudio) bgAudio.pause();
          } else {
            this.ctx.resume();
            if (bgAudio) bgAudio.play().catch(() => {});
          }
        }
        return !this.isMuted;
      }

      startDrone() {
        if (!this.ctx) return;
        this.droneGain = this.ctx.createGain();
        this.droneGain.gain.setValueAtTime(0.06, this.ctx.currentTime);
        this.droneGain.connect(this.ctx.destination);

        const osc1 = this.ctx.createOscillator();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(138.59, this.ctx.currentTime); // Sa

        const osc2 = this.ctx.createOscillator();
        osc2.type = 'triangle';
        osc2.frequency.setValueAtTime(207.65, this.ctx.currentTime); // Pa

        osc1.connect(this.droneGain);
        osc2.connect(this.droneGain);
        osc1.start();
        osc2.start();
      }

      playTempleBell(freq = 880) {
        if (!this.ctx || this.isMuted) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 2.8);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 2.9);

        const overtone = this.ctx.createOscillator();
        const overGain = this.ctx.createGain();
        overtone.type = 'triangle';
        overtone.frequency.setValueAtTime(freq * 2.76, now);
        overGain.gain.setValueAtTime(0.18, now);
        overGain.gain.exponentialRampToValueAtTime(0.0001, now + 1.6);
        overtone.connect(overGain);
        overGain.connect(this.ctx.destination);
        overtone.start(now);
        overtone.stop(now + 1.7);
      }

      playShankh() {
        if (!this.ctx || this.isMuted) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.exponentialRampToValueAtTime(260, now + 1.2);
        osc.frequency.exponentialRampToValueAtTime(210, now + 3.2);

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(450, now);

        gain.gain.setValueAtTime(0.01, now);
        gain.gain.linearRampToValueAtTime(0.45, now + 0.9);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 3.8);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 3.9);
      }

      playManjira() {
        if (!this.ctx || this.isMuted) return;
        this.playTempleBell(1760);
      }
    }

    const sound = new DevotionalSoundEngine();
    const audioBtn = document.getElementById('audio-toggle');
    audioBtn.addEventListener('click', () => {
      const active = sound.toggleMute();
      audioBtn.textContent = active ? '🔊 ध्वनि चालू' : '🔇 ध्वनि बंद';
    });

    /* =========================================================================
       2. CANVAS ENGINE: PETALS, SPARKS & FIREWORKS
       ========================================================================= */
    const bgCanvas = document.getElementById('bg-canvas');
    const bgCtx = bgCanvas.getContext('2d');
    const fxCanvas = document.getElementById('fx-canvas');
    const fxCtx = fxCanvas.getContext('2d');

    let w = bgCanvas.width = fxCanvas.width = window.innerWidth;
    let h = bgCanvas.height = fxCanvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      w = bgCanvas.width = fxCanvas.width = window.innerWidth;
      h = bgCanvas.height = fxCanvas.height = window.innerHeight;
    });

    const petals = [];
    const sparks = [];
    const fireworks = [];

    class SacredPetal {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * w;
        this.y = -20 - Math.random() * 50;
        this.size = 10 + Math.random() * 12;
        this.speedY = 1.2 + Math.random() * 2;
        this.speedX = Math.sin(Math.random() * Math.PI) * 1.5;
        this.rotation = Math.random() * 360;
        this.spin = (Math.random() - 0.5) * 2;
        this.color = ['#ff8800', '#ffaa00', '#d82200', '#f44336'][Math.floor(Math.random() * 4)];
      }
      update() {
        this.y += this.speedY;
        this.x += Math.sin(this.y * 0.015) + this.speedX * 0.4;
        this.rotation += this.spin;
        if (this.y > h + 20) this.reset();
      }
      draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate((this.rotation * Math.PI) / 180);
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.ellipse(0, 0, this.size * 0.5, this.size, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    class GoldenSpark {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * w;
        this.y = Math.random() * h;
        this.radius = 0.8 + Math.random() * 2.2;
        this.alpha = 0.2 + Math.random() * 0.8;
        this.speedY = -0.3 - Math.random() * 0.8;
      }
      update() {
        this.y += this.speedY;
        this.alpha += Math.sin(this.y * 0.05) * 0.02;
        if (this.y < -10) this.reset();
      }
      draw(ctx) {
        ctx.save();
        ctx.fillStyle = `rgba(255, 215, 100, ${Math.max(0.1, Math.min(1, this.alpha))})`;
        ctx.shadowBlur = 10;
        ctx.shadowColor = 'gold';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    for (let i = 0; i < 28; i++) petals.push(new SacredPetal());
    for (let i = 0; i < 65; i++) sparks.push(new GoldenSpark());

    function triggerFlowerShower(multiplier = 35) {
      for (let i = 0; i < multiplier; i++) {
        const p = new SacredPetal();
        p.y = -10;
        petals.push(p);
      }
      if (petals.length > 90) petals.splice(0, petals.length - 90);
    }

    function createFirework(x, y) {
      const colors = ['#ffe066', '#ff4d4d', '#ff9900', '#ffd700'];
      for (let i = 0; i < 35; i++) {
        const angle = Math.random() * Math.PI * 2;
        const vel = 2 + Math.random() * 4.5;
        fireworks.push({
          x, y,
          vx: Math.cos(angle) * vel,
          vy: Math.sin(angle) * vel,
          alpha: 1,
          color: colors[Math.floor(Math.random() * colors.length)]
        });
      }
    }

    function renderParticles() {
      bgCtx.clearRect(0, 0, w, h);
      fxCtx.clearRect(0, 0, w, h);

      for (let s of sparks) {
        s.update();
        s.draw(bgCtx);
      }
      for (let p of petals) {
        p.update();
        p.draw(fxCtx);
      }

      for (let i = fireworks.length - 1; i >= 0; i--) {
        const f = fireworks[i];
        f.x += f.vx;
        f.y += f.vy;
        f.vy += 0.05;
        f.alpha -= 0.02;
        if (f.alpha <= 0) {
          fireworks.splice(i, 1);
          continue;
        }
        fxCtx.save();
        fxCtx.fillStyle = f.color;
        fxCtx.globalAlpha = f.alpha;
        fxCtx.shadowBlur = 12;
        fxCtx.shadowColor = 'gold';
        fxCtx.beginPath();
        fxCtx.arc(f.x, f.y, 2.5, 0, Math.PI * 2);
        fxCtx.fill();
        fxCtx.restore();
      }

      requestAnimationFrame(renderParticles);
    }
    renderParticles();

    /* =========================================================================
       3. EXACT FILENAME CONFIGURATION
       ========================================================================= */
    const IMG_SANCTUM_NIGHT   = "Screenshot_20260929-212039.png";
    const IMG_TEMPLE_JEWELED  = "Screenshot_20260929-212048.png";
    const IMG_SHERAWALI_LION  = "Screenshot_20260929-212112.png";

    const container = document.getElementById('experience-container');
    const modal = document.getElementById('blessing-modal');
    const blessingText = document.getElementById('blessing-content');
    const nextBtn = document.getElementById('blessing-next-btn');
